name: Build RA2 iPad Shell

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ios/Sources/**"
      - ".github/workflows/build-ipad.yml"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install web dependencies
        working-directory: redalert2
        run: bun install --frozen-lockfile

      # The repository currently has unrelated pre-existing TypeScript errors in
      # gameplay/tester files. The iPad shell artifact only needs the native
      # launcher to compile; the final All-in-One packager injects the locally
      # rebuilt WebDist produced by prepare-ra2.ps1.
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create placeholder resource folders
        shell: bash
        run: |
          mkdir -p ios/Resources/WebDist ios/Resources/GameRes
          printf '%s\n' '<!doctype html><html><body>RA2 shell placeholder</body></html>' > ios/Resources/WebDist/index.html
          printf '%s\n' '{"files":[]}' > ios/Resources/GameRes/manifest.json

      - name: Generate Xcode project
        shell: bash
        env:
          RA2_TEAM_ID: ""
          RA2_BUNDLE_ID: com.dvorov.ra2yr
          RA2_APP_NAME: "Red Alert 2"
        run: |
          cd ios
          xcodegen generate

      - name: Build unsigned iOS app
        shell: bash
        run: |
          xcodebuild \
            -project ios/RA2.xcodeproj \
            -scheme RA2 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned shell IPA
        shell: bash
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/RA2.app"
          test -d "$APP"
          rm -rf Payload RA2-shell-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/RA2.app
          ditto -c -k --sequesterRsrc --keepParent Payload RA2-shell-unsigned.ipa
          ls -lh RA2-shell-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RA2-shell-unsigned
          path: RA2-shell-unsigned.ipa
          if-no-files-found: error
